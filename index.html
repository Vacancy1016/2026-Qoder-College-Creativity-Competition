<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大学航线｜产品流程与技术框架</title><style>
:root{--bg:#f8f7f2;--paper:#fffefa;--ink:#22312a;--muted:#617068;--line:#d7dfd5;--accent:#24684e;--soft:#eaf0e6;--warm:#f5eadf;--orange:#9b4c2d}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 'Manrope','Microsoft YaHei',sans-serif}button,select{font:inherit}button,a,select{touch-action:manipulation}button,select{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 16px;min-height:44px}button:hover{background:var(--soft)}button:disabled{cursor:default;opacity:.4}a{color:var(--accent);text-underline-offset:4px}.shell{max-width:1280px;margin:auto;padding:0 48px}.top{height:80px;display:flex;justify-content:space-between;align-items:center;gap:24px;border-bottom:1px solid var(--line)}.brand{font-size:16px;font-weight:600;letter-spacing:-.5px}.brand span{color:var(--accent)}.top-meta{font-size:12px;color:var(--muted)}.top-actions{display:flex;gap:8px}.top-actions button{font-size:12px}.page{padding:40px 0 32px;min-height:calc(100svh - 172px)}.page[hidden]{display:none}.kicker{font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:600;margin-bottom:16px}h1,h2{font-size:36px;line-height:1.3;font-weight:600;letter-spacing:-1px;margin:0 0 16px}h1 span{color:var(--accent)}.subtitle{font-size:16px;color:var(--muted);max-width:920px;margin:0 0 32px}h3{font-size:20px;font-weight:600;line-height:1.5;margin:0 0 12px}p{margin:0 0 12px}p:last-child{margin-bottom:0}.pill{font-size:12px;display:inline-block;background:var(--soft);padding:4px 12px;border-radius:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{padding:24px;border:1px solid var(--line);background:var(--paper);border-radius:12px;min-width:0}.panel.accent{background:var(--soft);border-color:var(--soft)}.panel.warm{background:var(--warm);border-color:var(--warm)}.label{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:1px;margin-bottom:16px}.warm .label{color:var(--orange)}.points{list-style:none;padding:0;margin:0}.points li{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.points li:last-child{border-bottom:0;padding-bottom:0}.points li:first-child{padding-top:0}.points strong{font-size:16px;font-weight:500;display:block;margin-bottom:4px}.points span{color:var(--muted)}.statement{margin-top:24px;padding:20px 24px;background:var(--ink);color:#f5f8ef;border-radius:12px;font-size:16px}.small{font-size:12px;color:var(--muted)}.footnote{font-size:12px;color:var(--muted);margin-top:20px}.four{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:12px;min-width:0}.card .label{margin-bottom:12px}.card p{font-size:14px}.card ul{padding-left:20px;font-size:14px;margin:0}.card li{margin:6px 0}.boundary{padding:16px 20px;margin-top:20px;border-radius:8px;background:var(--warm);font-size:12px;color:#754d36}.handoff{display:flex;align-items:center;gap:12px;margin-top:24px;padding:16px 20px;background:var(--soft);border-radius:8px;font-size:14px;flex-wrap:wrap}.handoff span{font-size:12px;color:var(--muted)}.handoff b{font-weight:500}.handoff i{font-style:normal;color:var(--accent)}.nav{display:flex;align-items:center;gap:24px;justify-content:space-between;min-height:92px;border-top:1px solid var(--line)}.nav-group{display:flex;align-items:center;gap:12px}.primary{background:var(--accent);border-color:var(--accent);color:white}.primary:hover{background:#194d39}.counter{font-size:14px;white-space:nowrap}.counter span{color:var(--muted);font-size:12px}.progress{flex:1;height:4px;border-radius:4px;background:var(--line);max-width:260px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);transform-origin:left;transition:transform .3s cubic-bezier(.22,1,.36,1)}.next-label{font-size:12px;color:var(--muted);max-width:240px}.foundation{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;padding:16px 20px;border-radius:8px;background:var(--soft);font-size:14px;margin-bottom:20px}.foundation b{font-weight:600}.foundation small{display:block;font-size:12px;color:var(--muted)}.flow-stage{font-size:12px;color:var(--muted);margin:12px 0}.flow-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}.flow-node{position:relative;text-align:left;padding:16px;background:var(--paper);border:1px solid var(--line);border-radius:8px;min-height:116px}.flow-node .number{font-size:12px;color:var(--accent);display:block;margin-bottom:8px}.flow-node strong{display:block;font-size:16px;font-weight:600}.flow-node small{font-size:12px;color:var(--muted);display:block;margin-top:4px}.flow-node:not(:last-child):after{content:'→';position:absolute;right:-21px;top:40px;color:var(--accent)}.flow-join{padding:12px;font-size:12px;color:var(--accent);text-align:center}.flow-feedback{padding:16px 20px;border:1px solid var(--line);border-radius:8px;font-size:12px;margin-top:20px;color:var(--muted)}.flow-feedback strong{color:var(--accent)}.mini-chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;margin:16px 0}.mini-chain b{font-weight:500;padding:8px 12px;border-radius:6px;background:var(--soft)}.mini-chain i{font-style:normal;color:var(--accent)}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.summary-card{padding:24px;border-radius:12px;background:var(--paper);border:1px solid var(--line)}.summary-card .num{font-size:30px;line-height:1;color:var(--accent);margin-bottom:16px}.summary-card p{font-size:14px}.references{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;margin-top:20px}.references a{color:var(--muted)}dialog{border:1px solid var(--line);border-radius:16px;padding:32px;background:var(--bg);color:var(--ink);width:min(720px,calc(100% - 32px));max-height:85svh;overflow:auto}dialog::backdrop{background:#172b2377;backdrop-filter:blur(6px)}.dialog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.dialog-top h2{font-size:24px;margin:0}.toc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toc-grid button{text-align:left;font-size:12px;padding:12px}.toc-grid button.active{background:var(--soft);border-color:var(--accent)}.skip{position:fixed;z-index:10;left:12px;top:12px;transform:translateY(-200%);background:var(--paper);padding:12px}.skip:focus{transform:none}.noscript{padding:24px;background:var(--warm)}.page-heading:focus{outline:none}
@media(min-width:1500px){.page{padding-top:56px}.four{gap:24px}.card{padding:28px}}
@media(max-width:900px){.shell{padding:0 24px}.top-meta{display:none}.flow-row{gap:16px}.flow-node:not(:last-child):after{right:-15px}.next-label{display:none}.progress{max-width:180px}}
@media(max-width:620px){.shell{padding:0 16px}.top{height:72px;gap:12px}.brand{font-size:14px}.top-actions button{padding:8px 12px}.top-actions button:last-child{display:none}.page{padding:28px 0 24px;min-height:calc(100svh - 164px)}h1,h2{font-size:30px;letter-spacing:-.5px}.subtitle{font-size:14px;margin-bottom:24px}.two,.four,.summary-grid{grid-template-columns:1fr;gap:16px}.card,.panel,.summary-card{padding:20px}.label{margin-bottom:12px}.nav{gap:12px;min-height:92px}.nav-group{gap:8px}.nav button{padding:8px 12px;font-size:14px}.counter{font-size:12px}.counter span{display:none}.progress{display:none}.foundation{grid-template-columns:1fr;gap:8px}.foundation>span{text-align:center;transform:rotate(90deg)}.flow-row{grid-template-columns:1fr 1fr;gap:12px}.flow-node{min-height:120px;padding:12px}.flow-node:after{display:none}.flow-node strong{font-size:14px}.flow-node small{font-size:12px}.statement{padding:16px 20px;font-size:14px}.handoff{gap:8px;padding:16px}.toc-grid{grid-template-columns:1fr}dialog{padding:24px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.progress span{transition:none}}
@media print{body{background:white;font-size:10pt}.shell{padding:0;max-width:none}.top,.nav,.skip,dialog{display:none!important}.page,.page[hidden]{display:block!important;min-height:0;break-after:page;padding:0}.page:last-child{break-after:auto}.page h1,.page h2{font-size:24pt}.subtitle{font-size:11pt}.two,.four{grid-template-columns:1fr 1fr;gap:12pt}.card,.panel{padding:14pt;break-inside:avoid}.card p,.card li,.points li{font-size:10pt}.statement{color:#111;background:#eee}.flow-row{grid-template-columns:repeat(4,1fr)}.flow-node:after{display:none}.summary-grid{grid-template-columns:repeat(3,1fr)}.boundary,.handoff{font-size:9pt}.footnote{font-size:8pt}.references{font-size:8pt}a{color:#222}.page:not(:first-child){padding-top:12pt}}
.parallel-group{grid-column:span 2;border:1px dashed var(--line);border-radius:8px;padding:8px 12px}.parallel-group>span{font-size:12px;color:var(--accent)}.parallel-group>div{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}.parallel-group .flow-node{min-height:84px;padding:12px}.parallel-group .flow-node:after{display:none}@media(max-width:620px){.parallel-group{grid-column:span 2}}
</style></head><body><a class="skip" href="#content">跳到当前页正文</a><div class="shell"><header class="top"><div class="brand">Course Compass <span>大学航线</span></div><div class="top-meta">产品流程 × 技术框架 · 分页演示版 · 2026.11.18</div><div class="top-actions"><button id="toc-open">目录 / 跳页</button><button id="print">打印全部页</button></div></header><main id="content"></main><footer class="nav"><div class="counter" id="counter" role="status" aria-live="polite"></div><div class="progress" aria-hidden="true"><span id="progress"></span></div><div class="next-label" id="next-label"></div><div class="nav-group"><button id="prev">← 上一页</button><button class="primary" id="next">下一页 →</button></div></footer></div><dialog id="toc" aria-labelledby="toc-title"><div class="dialog-top"><h2 id="toc-title">按逻辑逐页展开</h2><button id="toc-close" aria-label="关闭目录">关闭</button></div><div id="toc-items" class="toc-grid"></div></dialog><noscript><div class="noscript">请启用JavaScript查看分页内容。主线为：痛点与办法 → 总体流程 → 数据底座 → 八步拆解 → Agent扩展 → 总结。</div></noscript><script>
'use strict';
const steps=[
{n:'01',title:'建立个人档案',headline:'先知道学生的起点，才能谈个性化。',intro:'回答“我在哪所学校、学到哪里、有哪些成果、还能投入多少时间”。本页只建立事实，不急着推荐职业。',implement:['收集学校、专业、入学年级与培养方案版本。','确认已修/通过课程、个人作业与项目、每周时间。','允许先试用演示档案；未知信息留空并提示补充。'],tech:['React + TypeScript：表单、上传、确认页。','FastAPI + Pydantic：字段与格式校验。','PostgreSQL：用户档案、修读状态、个人成果索引。'],data:['用户填写基本信息；有权使用的课表/成绩信息可导入。','课程名称映射到本校课程号，导入结果由用户核对。','个人资料按用户隔离，不加入公共课程图。'],output:['输出：个人起点档案，包括已修记录与证据索引。','交给下一步：辅助选择目标方向，避免从零猜用户。','已有项目的用户，后续可直接进入成果核验与岗位匹配。'],input:'学校与年级 / 已修课程 / 已有成果',out:'个人起点档案',next:'确认目标方向',boundary:'已修过一门课不等于已证明掌握所有相关技能；课程记录和成果证据必须分开。',example:'例：大二、编程基础已通过、数据库尚未学、每周能投入8小时。先保存这些事实。'},
{n:'02',title:'确认目标方向',headline:'有目标就拆要求，没目标就先探索。',intro:'让学生自己确认要探索或准备的职业方向；系统提供可比较的选项，不用一次AI判断替用户做人生决定。',implement:['有目标：选择前端/后端/数据等方向，或粘贴目标JD。','没目标：结合兴趣、课程与成果给2–3个候选方向。','展示各方向要求与差异，由用户确认一个当前目标。'],tech:['角色模板库 + 关键词/技能规则：生成方向候选。','大模型结构化抽取：从JD提取技能、资格、时间要求。','FastAPI目标接口：保存已确认方向与所用岗位快照。'],data:['平台预先准备经核验的方向模板，注明不是具体在招岗位。','实际JD来自用户粘贴或授权来源，保留链接与观察时间。','用户补充兴趣、城市和可实习时间；没有来源的要求标未知。'],output:['输出：已确认目标 + 目标技能要求清单。','保留：来自通用模板还是某条真实JD。','交给缺口分析：明确“需要具备什么”，而不是直接生成课程。'],input:'个人档案 + 兴趣 / 目标JD',out:'确认目标与技能要求',next:'分析技能缺口',boundary:'方向模板用于探索，不冒充某家公司的招聘信息；方向可以随兴趣和成果变化重新选择。',example:'例：选择后端开发，目标JD要求SQL与API；系统保留对应原文条款。'},
{n:'03',title:'分析技能缺口',headline:'先找“差在哪里”，再决定“补什么课”。',intro:'把岗位要求与个人起点放到同一技能标准下，区分未学习、学过未证明、已有证据。',implement:['对齐目标技能与已修课程、已提交产物。','逐项标记：尚未学习 / 学过待验证 / 已有证据。','给每个缺口找出相关课程与作业路径，说明依据。'],tech:['课程—技能—岗位图检索：查找关联路径。','技能别名标准化 + 规则匹配：避免同名/近义词混乱。','大模型仅生成有来源解释，不直接认定学生已熟练。'],data:['读取已审核课程图、目标技能表与本人学习/成果记录。','关系携带原文位置、审核状态、培养方案版本。','能力证据附产物版本和检查范围；未知熟练度不填数字。'],output:['输出：分类型的技能缺口表，以及可追溯关系。','未学过 → 交给课程推荐；学过未证明 → 引导补成果。','已有证据 → 可用于当前岗位匹配，不必重复上课。'],input:'目标要求 + 个人起点 + 共享图谱',out:'技能缺口与依据',next:'生成课程与学习路线',boundary:'选择了课程只意味着计划学习，不能因此提升“当前已有能力”或声称已满足岗位要求。',example:'例：缺SQL且未学数据库 → 建议补课；数据库已通过却无产物 → 先核验作业，不重复推荐。'},
{n:'04',title:'推荐课程与展示路径',headline:'推荐必须本学期能执行，而不只是看起来相关。',intro:'先校验学校与课表规则，再推荐课程；知识图谱同时解释“前面要学什么、这门课通向哪里”。',implement:['从缺口反推本校课程、作业与建议学习顺序。','检查先修、必修、开课学期、学分和时间冲突。','展示个人路径图；允许换课并查看替代方案与剩余缺口。'],tech:['关系遍历 / 拓扑排序：检查先修与学习顺序。','规则 + 小规模搜索；复杂组合可用OR-Tools CP-SAT。','Cytoscape.js：展示局部子图，与课程清单双向联动。'],data:['必须有培养方案、开课实例、先修表达式与课表。','每周工作量由合理估计或用户调整，不等同于总学时。','先修、AND/OR、并修分别表达；缺课表时只给待确认草案。'],output:['输出：可行课程清单 + 顺序 + 推荐/暂缓原因。','个人图展示现有图谱的子集，不现场创造课程关系。','确认课程后，按实际作业继续规划项目。'],input:'缺口表 + 课程图 + 选课约束',out:'可行学习计划与路径图',next:'把课程作业变成项目任务',boundary:'无解时说明冲突和可放宽的偏好；不能静默跳过硬先修或毕业必修。最终选课仍以学校系统为准。',example:'例：数据库与统计冲突；针对后端目标给出先数据库的路线，并说明统计课如何延后。'},
{n:'05',title:'从课程作业规划项目',headline:'让一次已经要做的作业，成为有价值的项目起点。',intro:'推荐增量任务，而不是随机生成一个高级项目名。每项任务都对应技能缺口、可提交产物与验收标准。',implement:['读取当前课程的实际作业要求，识别已有基础。','对照目标技能，推荐少量可以完成的升级任务。','拆分里程碑：做什么、交什么、怎样判断完成。'],tech:['作业—技能图检索 + 人工项目模板库。','大模型按模板提出个性化任务，规则校验时间与先修。','项目计划表：保存任务、依赖、产物与rubric版本。'],data:['课程作业原文、目标技能缺口、用户可用时间。','平台准备3–5个可执行升级模板，附测试或复现标准。','团队作业要明确个人负责部分，遵守学校AI使用规定。'],output:['输出：项目任务清单 + 里程碑 + 产物要求。','此时仍是计划，不是已完成项目或能力证明。','用户实际完成后提交材料，进入下一步核验。'],input:'实际作业 + 目标缺口 + 时间',out:'可执行项目升级计划',next:'提交并核验真实成果',boundary:'只建议符合规定的个人拓展与反馈，不擅自改变课程提交要求，不代写禁止代写的作业。',example:'例：数据库大作业 → 增加查询API → 补输入校验与测试 → 写清复现README。'},
{n:'06',title:'核验成果与更新能力',headline:'把“计划做过”与“真正做出来”分开。',intro:'这是学习路线进入求职推荐前的关键节点。系统检查材料能支持什么结论，并记录个人贡献与验证范围。',implement:['收集代码、报告、演示、测试和个人贡献说明。','按rubric检查已完成项、未完成项与证据支持度。','建立成果→技能的个人证据关系；已有项目可直接进入。'],tech:['对象存储：私密文件与报告；PostgreSQL：产物版本和证据关联。','规则检查 + 外部CI结果 + 必要人工复核。','证据ID与版本管理：简历及岗位匹配引用同一事实。'],data:['用户有权提供的本人产物、仓库版本与运行记录。','团队贡献单独确认，学校成绩单不作为技能满分凭据。','模型辅助整理材料；未经验证的结论保持自述或待核验。'],output:['输出：个人成果档案 + 支持的技能 + 证据范围。','同时交给简历模块和岗位模块，不强制先写简历。','新成果回流缺口分析，更新学习路线和当前匹配。'],input:'本人产物 + 任务验收标准',out:'可追溯成果与技能证据',next:'简历表达 / 岗位匹配并行使用',boundary:'文件hash固定版本但不证明作者；自动测试不等于学校认证。首版不在API进程执行任意用户代码。',example:'例：代码与测试可支持“实现查询接口和校验”；不能据此写高并发、十万用户或未知提升比例。'},
{n:'07',title:'生成有依据的简历建议',headline:'把真实成果写清楚，不替学生制造经历。',intro:'按目标岗位挑选相关成果，再建议项目背景、个人模块、实现方法和可验证结果的表述方式。',implement:['选择与JD相关的已完成成果，突出本人贡献。','生成可编辑项目草稿，逐句关联证据或待补字段。','核验技术、数字与完成状态，用户确认后再导出。'],tech:['证据检索 + 大模型受限生成。','claim → evidence映射 + 事实规则校验。','编辑器与导出模板；PDF/DOCX可按首版范围逐步增加。'],data:['本人已核验产物、目标JD、用户确认的个人贡献。','数字必须来自真实指标记录，不让模型补“漂亮数据”。','证据更新/删除时把关联草稿标为过期，要求复查。'],output:['输出：针对岗位的简历项目草稿与待补内容。','每条事实能展开查看材料出处，不支持的内容不通过。','供用户准备投递材料；岗位匹配不依赖先导出简历。'],input:'成果证据 + 目标JD',out:'带证据的简历草稿',next:'用户审核后用于具体投递',boundary:'未完成项目不能写成完成；没有依据的业绩数字删除或待补。简历不是系统认定能力的唯一输入。',example:'例：“为课程项目实现查询接口与输入校验，补充异常输入测试；复现说明见仓库。”'},
{n:'08',title:'匹配实习与记录投递反馈',headline:'匹配当前能证明的能力，同时告诉用户下一步补什么。',intro:'已有成果的用户可以直接到这里。当前候选与未来目标分开展示，用户到原站确认岗位并实际投递。',implement:['先检查毕业窗口、城市、到岗时间、实习天数与硬技能。','展示匹配原因、未满足项、来源日期和原岗位链接。','用户手动记投递/面试状态；新成果或目标变化后重新匹配。'],tech:['岗位适配器 + 资格规则 + 加权技能覆盖。','关键词/技能召回优先，可选Embedding辅助查相近表述。','原站深链 + 投递状态表；不做无授权自动群发。'],data:['当期JD快照、观察时间、状态与来源许可。','个人技能证据与可实习时间；计划中的技能不计已具备。','字段缺失显示unknown，过期样本标stale，不宣称实时在招。'],output:['输出：当前候选 / 未来目标 / 待确认资格三类岗位。','用户查看原站，确认材料后投递并记录进展。','面试反馈与新成果回到缺口分析，形成长期规划闭环。'],input:'当期岗位 + 本人证据 + 时间条件',out:'岗位候选与行动反馈',next:'反馈 / 新成果 → 回到缺口分析',boundary:'技能覆盖分不是录用概率；一次拒绝不等于某项能力差。BOSS接入需先取得正式许可，首版不保存其账号Cookie。',example:'例：SQL/API已有证据且时间符合 → 候选后端实习；缺某强制框架要求 → 放未来目标并给补齐路线。'}
];
const slides=[];
slides.push({title:'痛点与解决办法',type:'intro'});
slides.push({title:'总体流程图',type:'flow'});
slides.push({title:'实现前提：数据与图谱底座',type:'foundation'});
steps.forEach(function(s){slides.push({title:s.n+' · '+s.title,type:'step',data:s})});
slides.push({title:'可选扩展：Agent与系统架构',type:'agent'});
slides.push({title:'总结：首版做成什么',type:'summary'});
function bullets(items){return '<ul>'+items.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'}
function stepContent(s){return '<div class="kicker">步骤 '+s.n+' / 实现拆解</div><h2>'+s.headline+'</h2><p class="subtitle">'+s.intro+'</p><div class="four"><div class="card"><div class="label">01 / 需要实现什么</div>'+bullets(s.implement)+'</div><div class="card"><div class="label">02 / 使用什么技术</div>'+bullets(s.tech)+'</div><div class="card"><div class="label">03 / 数据如何准备</div>'+bullets(s.data)+'</div><div class="card"><div class="label">04 / 输出与下一步</div>'+bullets(s.output)+'</div></div><div class="handoff"><span>输入</span><b>'+s.input+'</b><i>→</i><span>本步输出</span><b>'+s.out+'</b></div><div class="boundary"><b>必须守住的边界：</b>'+s.boundary+'</div><p class="footnote">'+s.example+'（合成示例）</p>'}
function intro(){return '<div class="kicker">01 / 痛点与解决办法</div><h1>大学里学了很多，<br><span>却不知道怎样走向想做的工作。</span></h1><p class="subtitle">目标用户：有选课与实习准备需求的大学生。我们要解决的是课程、作业、能力和岗位之间缺少明确连接。</p><div class="two"><div class="panel warm"><div class="label">当前痛点</div><ul class="points"><li><strong>选课不知道为什么选</strong><span>知道想做后端或数据，却不清楚本校课程能补什么。</span></li><li><strong>作业完成后没有沉淀</strong><span>缺少从大作业到可展示项目的升级任务与验收标准。</span></li><li><strong>求职建议难以追溯</strong><span>项目、简历与岗位推荐看似匹配，却说不清依据。</span></li></ul></div><div class="panel accent"><div class="label">我们的解决办法</div><ul class="points"><li><strong>从职业要求反推课程</strong><span>用本校课程图谱找技能缺口，再给可执行的选课路线。</span></li><li><strong>把作业升级成真实成果</strong><span>明确任务、产物与核验方式，形成个人能力证据。</span></li><li><strong>让证据支撑求职</strong><span>简历与岗位匹配共同使用真实成果，展示来源和缺口。</span></li></ul></div></div><div class="statement">产品定位：不是再做一个AI简历工具，而是帮助学生把“下一门课、下一份作业”与职业目标对应起来。</div><p class="footnote">痛点为当前产品假设，待用学生的真实课表、作业和JD验证；不是已完成调研的统计结论。</p>'}
function flowNode(s,index){return '<button class="flow-node" data-jump="'+(index+3)+'"><span class="number">'+s.n+'</span><strong>'+s.title+'</strong><small>点击查看本步分析</small></button>'}
function flow(){return '<div class="kicker">02 / 总体流程图</div><h2>先形成学习路线，再用真实成果连接就业。</h2><p class="subtitle">目标明确就选方向；目标不明确，先探索后确认。以下八步共用课程图谱与岗位资料，已有项目可跳到第06步。</p><div class="foundation"><div><b>数据底座：课程资料 + 岗位要求</b><small>预先形成课程—技能—作业—岗位图谱</small></div><span>→</span><div><b>为整个流程提供依据</b><small>不是用户选完课后才临时猜关系</small></div></div><div class="flow-stage">阶段一 / 确定目标与学习路线：01 → 02 → 03 → 04</div><div class="flow-row">'+steps.slice(0,4).map(flowNode).join('')+'</div><div class="flow-join">↓ 课程计划交给项目任务；已有成果可直接进入06</div><div class="flow-stage">阶段二 / 从学习沉淀成果：05 → 06 → 07、08</div><div class="flow-row">'+flowNode(steps[4],4)+flowNode(steps[5],5)+'<div class="parallel-group"><span>06之后，证据分两路使用</span><div>'+flowNode(steps[6],6)+flowNode(steps[7],7)+'</div></div>'+'</div><div class="flow-feedback"><strong>重要分流：</strong>06成果核验后，证据同时提供给07简历和08岗位匹配，不必等简历完成才查岗位。<br><strong>反馈闭环：</strong>08中的新成果、时间或目标变化 → 回到03技能缺口 → 调整04课程与05项目计划。</div><p class="footnote">图中前后关系表示主要成长流程，不是使用门槛；用户已有能力时可以直接匹配当前实习。</p>'}
function foundation(){return '<div class="kicker">03 / 进入八步之前：平台先准备数据</div><h2>没有可信课程与岗位资料，推荐就只能靠猜。</h2><p class="subtitle">先从一校一专业开始，把公共课程关系与学生私人成果分开管理。用户进入后，生成的是个人路线，不是重新发明课程关系。</p><div class="four"><div class="card"><div class="label">课程资料</div><ul><li>培养方案、课程大纲、先修、开课学期、课表与作业要求。</li><li>用户或学校提供有权使用的材料；CSV/PDF/DOCX解析，扫描件OCR。</li><li>模型抽候选，人工确认课程号、先修及原文位置。</li></ul></div><div class="card"><div class="label">岗位资料</div><ul><li>用户粘贴JD、授权导出与允许使用的企业官方来源。</li><li>抽技能、资格、地点和实习时间，保存原文与观察日期。</li><li>BOSS通用官方搜索API尚未核实，不能作为首版前置依赖。</li></ul></div><div class="card"><div class="label">课程知识图谱</div><ul><li>节点：课程 / 技能 / 作业 / 职业与岗位。</li><li>关系：先修 / 教授 / 练习 / 岗位要求，不能混用。</li><li>MVP用PostgreSQL关系表与递归查询；图查询层可换Neo4j。</li></ul></div><div class="card"><div class="label">审核与版本</div><ul><li>统一技能别名，避免Java与JavaScript错误合并。</li><li>关系附来源与版本；先修不明就待核实，不让模型补事实。</li><li>个人成绩、项目与简历按owner隔离，不混进共享图谱。</li></ul></div></div><div class="mini-chain"><b>数据库原理</b><i>教授 →</i><b>SQL</b><i>被要求于 →</i><b>后端岗位</b><i>同时关联</i><b>数据库作业</b></div><div class="boundary">上图仅为关系示意。公开可读不等于允许无限采集或转载；招聘平台接口获得正式文档与授权后再接入。</div>'}
function agent(){return '<div class="kicker">12 / 可选扩展：核心流程跑通后再加</div><h2>Agent负责调用已有模块，不另造一套推荐逻辑。</h2><p class="subtitle">基础系统先独立工作。后续聊天入口把自然语言问题，转成对图谱、规划器、证据库和岗位模块的受限调用。</p><div class="two"><div class="panel"><div class="label">一个有价值的问答流程</div><h3>“数据库和统计课冲突，怎么办？”</h3><div class="mini-chain"><b>读取目标与课表</b><i>→</i><b>调用选课规划</b><i>→</i><b>解释两条路线</b></div><p class="small">RAG + 工具调用；需要暂停确认与恢复时可用LangGraph。保存修改前展示差异并确认；不能自动改计划或投递。</p></div><div class="panel accent"><div class="label">系统模块如何协同</div><ul class="points"><li><strong>React / TypeScript前端</strong><span>档案、图谱、计划、成果、简历与岗位界面。</span></li><li><strong>FastAPI业务服务</strong><span>统一鉴权；规则算约束，模型做抽取与解释。</span></li><li><strong>PostgreSQL + 对象存储</strong><span>保存关系、版本、个人材料与来源；Worker处理长任务。</span></li></ul></div></div><div class="statement">正式参赛入口用Qoder Sites发布，并保留真实Qoder开发过程；账号动态能力、Python后端托管形态与额度要先实测。</div><p class="footnote">只读回答可直接返回；计划写入与外部操作必须明确确认。上传的JD和材料只是数据，不能改变系统权限。</p>'}
function summary(){return '<div class="kicker">13 / 总结与首版落地</div><h2>把一条路径做可信，再扩大覆盖范围。</h2><p class="subtitle">首版的成功标准：学生能解释“为什么选这门课、作业要补什么、成果能支持怎样的简历与岗位”。</p><div class="summary-grid"><div class="summary-card"><div class="num">01</div><h3>先做学习路线</h3><p>一校一专业约20门课，优先一个职业方向。跑通目标 → 缺口 → 可行课程与图谱解释。</p></div><div class="summary-card"><div class="num">02</div><h3>再做成果证据</h3><p>一个真实授权作业升级模板，明确任务与验收。用一份个人产物连接简历和JD。</p></div><div class="summary-card"><div class="num">03</div><h3>最后扩展入口</h3><p>先用用户JD与许可样本。Agent、多平台接口和跨校适配放第二阶段，不让爬虫阻断演示。</p></div></div><div class="statement">一条可验证的闭环：目标岗位要求 → 本校课程 → 实际作业 → 个人成果 → 有依据的求职材料与行动。</div><div class="boundary"><b>开工前确认：</b>学校/专业/年级、可用课程和作业、第一条职业方向、团队人数与Qoder账号。找3–5名学生带课表、作业、JD验证卡点。</div><div class="references"><a href="https://fastapi.tiangolo.com/" target="_blank" rel="noopener noreferrer">FastAPI</a><a href="https://js.cytoscape.org/" target="_blank" rel="noopener noreferrer">Cytoscape.js</a><a href="https://www.postgresql.org/docs/current/queries-with.html" target="_blank" rel="noopener noreferrer">PostgreSQL递归查询</a><a href="https://developers.google.com/optimization/cp/cp_solver" target="_blank" rel="noopener noreferrer">OR-Tools</a><a href="https://docs.langchain.com/oss/python/langgraph/interrupts" target="_blank" rel="noopener noreferrer">LangGraph</a><a href="https://docs.qoder.cn/qoder/sites" target="_blank" rel="noopener noreferrer">Qoder Sites</a></div><p class="footnote">技术选型为方案建议，未声称已实现产品或接通招聘平台。官方资料于2026.11.17–18检索。离线可读；示例为合成场景；没有修改或发布现有Afterwinter网页。</p>'}
document.getElementById('content').innerHTML=slides.map(function(s,i){let body=s.type==='intro'?intro():s.type==='flow'?flow():s.type==='foundation'?foundation():s.type==='step'?stepContent(s.data):s.type==='agent'?agent():summary();return '<section class="page" id="page-'+(i+1)+'" aria-label="第'+(i+1)+'页：'+s.title+'" '+(i?'hidden':'')+'>'+body+'</section>'}).join('');
document.getElementById('toc-items').innerHTML=slides.map(function(s,i){return '<button data-jump="'+i+'">'+String(i+1).padStart(2,'0')+' / '+s.title+'</button>'}).join('');
let current=0;
function go(index,updateHash=true){current=Math.max(0,Math.min(slides.length-1,index));document.querySelectorAll('.page').forEach(function(p,i){p.hidden=i!==current});document.getElementById('counter').innerHTML=String(current+1).padStart(2,'0')+' / '+slides.length+' <span>· '+slides[current].title+'</span>';document.getElementById('progress').style.transform='scaleX('+((current+1)/slides.length)+')';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;document.getElementById('next-label').textContent=current<slides.length-1?'下一页：'+slides[current+1].title:'已到总结页';document.querySelectorAll('#toc-items button').forEach(function(b,i){b.classList.toggle('active',i===current)});if(document.getElementById('toc').open)document.getElementById('toc').close();if(updateHash)history.replaceState(null,'','#page-'+(current+1));window.scrollTo({top:0,behavior:'instant'});const h=document.querySelector('#page-'+(current+1)+' h1,#page-'+(current+1)+' h2');if(h){h.tabIndex=-1;h.classList.add('page-heading');h.focus({preventScroll:true})}}
document.getElementById('prev').onclick=function(){go(current-1)};document.getElementById('next').onclick=function(){go(current+1)};
document.querySelectorAll('[data-jump]').forEach(function(b){b.onclick=function(){go(Number(b.dataset.jump))}});
document.getElementById('toc-open').onclick=function(){document.getElementById('toc').showModal()};document.getElementById('toc-close').onclick=function(){document.getElementById('toc').close()};
document.getElementById('print').onclick=function(){window.print()};
document.addEventListener('keydown',function(e){if(document.getElementById('toc').open||e.altKey||e.ctrlKey||e.metaKey||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}});
function readHash(){const m=location.hash.match(/^#page-(\d+)$/);go(m?Number(m[1])-1:0,false)}
window.addEventListener('hashchange',readHash);readHash();
</script></body></html>
